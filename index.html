<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071426">
<meta name="description" content="مكتب الجزيرة - PS4 Host">
<title>مكتب الجزيرة | PS4 Host</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Tahoma,sans-serif}
html{min-height:100%;background:#071426;color:#fff5dc}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 10%,#254875 0%,transparent 47%),linear-gradient(145deg,#030a16 0%,#0c2042 58%,#050c1a 100%);color:#fff5dc;display:flex;flex-direction:column;position:relative}
body:before{content:"";position:fixed;z-index:0;pointer-events:none;left:0;top:0;right:0;bottom:0;background:linear-gradient(130deg,transparent 24%,rgba(193,140,43,.10) 48%,transparent 75%)}
header,main,footer{position:relative;z-index:1}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 4%;border-bottom:1px solid rgba(238,192,101,.33);background:rgba(4,13,29,.65)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:53px;height:53px;object-fit:contain;border-radius:9px;box-shadow:0 0 14px rgba(205,153,58,.17)}
h1{font-size:23px;line-height:1.2;color:#ffe1a0;margin:0}
.brand small{display:block;color:#b9cbe0;font-size:12px;margin-top:3px;letter-spacing:.8px}
button{cursor:pointer;font-family:Arial,Tahoma,sans-serif;font-weight:bold}
.theme{font-size:13px;color:#f5d995;border:1px solid rgba(227,183,98,.68);border-radius:25px;background:rgba(13,27,47,.8);padding:10px 15px}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:34px 18px}
.launcher{width:100%;max-width:580px;text-align:center;padding:36px 22px 34px;border:1px solid rgba(248,202,107,.65);border-radius:22px;background:linear-gradient(135deg,rgba(9,25,45,.88),rgba(8,19,38,.75));box-shadow:0 18px 58px rgba(0,0,0,.37),inset 0 1px rgba(255,255,255,.08)}
.launcher h2{font-size:clamp(27px,5vw,40px);letter-spacing:1px;margin:0 0 24px;color:#ffe3a9;text-shadow:0 3px 14px rgba(220,160,53,.21)}
.launch{display:block;margin:0 auto;max-width:420px;width:100%;min-height:68px;padding:16px 22px;border-radius:14px;border:1px solid #ffe9a9;color:#422908;background:linear-gradient(112deg,#a56a18 0%,#eec36e 22%,#fff3c0 48%,#e6ac43 71%,#c18a32 100%);font-size:23px;box-shadow:inset 0 3px 2px rgba(255,255,255,.74),inset 0 -3px rgba(92,51,11,.12),0 7px 25px rgba(229,159,47,.28);text-shadow:0 1px rgba(255,255,255,.55)}
.launch:hover,.launch:focus{filter:brightness(1.09);outline:2px solid #ffedb8;outline-offset:3px}
.launch:disabled{opacity:.65;cursor:wait}
#status{display:none;margin:17px auto 0;max-width:420px;font-size:15px;line-height:1.7;color:#e8d4ae}
#status.visible{display:block}
#spin{display:none;width:25px;height:25px;margin:14px auto 0;border-radius:50%;border:3px solid rgba(232,187,91,.25);border-top-color:#ffe4a6;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#state,#out{display:none}
footer{text-align:center;color:#c6d3e4;padding:16px 12px 22px;font-size:13px;background:rgba(4,12,24,.23);line-height:1.9}
html.light{background:#f3f6fb;color:#233652}
html.light body{background:radial-gradient(ellipse at 45% 10%,#fff8e3,transparent 60%),linear-gradient(140deg,#ebf2fd,#faf8f0 58%,#e4edf7);color:#233652}
html.light body:before{background:linear-gradient(130deg,transparent 25%,rgba(226,184,90,.12) 60%,transparent 88%)}
html.light header{background:rgba(255,255,255,.73);border-bottom-color:#cba65d}
html.light h1{color:#795019}
html.light .brand small{color:#536b82}
html.light .theme{background:#fff8e7;color:#725017;border-color:#c99c4e}
html.light .launcher{background:linear-gradient(130deg,rgba(255,255,255,.94),rgba(254,249,234,.90));border-color:#d6af64;box-shadow:0 14px 44px rgba(44,63,94,.13)}
html.light .launcher h2{color:#77501c;text-shadow:none}
html.light #status{color:#624922}
html.light footer{color:#4d6279}
body.done #spin,body.fail #spin{display:none!important}
@media(max-width:540px){header{padding:12px;gap:8px}.brand img{width:43px;height:43px}.brand{gap:8px}h1{font-size:19px}.brand small{font-size:10px}.theme{padding:9px 10px;font-size:12px}.launcher{padding:30px 18px}.launch{font-size:21px}}
@media(prefers-reduced-motion:reduce){#spin{animation:none}}

/* Gaming artwork: local image, unobstructed and independent of the old background. */
main{flex-direction:column;justify-content:center;gap:18px;padding:18px 18px 28px}
.game-art{position:relative;display:block;width:100%;max-width:1040px;height:clamp(135px,25vh,235px);overflow:hidden;border-radius:19px;border:1px solid rgba(244,196,101,.55);background:linear-gradient(110deg,rgba(5,17,34,.9),rgba(18,47,82,.82),rgba(6,17,35,.9));box-shadow:0 15px 42px rgba(0,0,0,.32);text-align:center}
.game-art:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 33%,rgba(6,16,33,.23));z-index:1}
.game-art img{display:block;width:100%;height:100%;object-fit:contain;object-position:center}
.launcher{max-width:580px;width:100%}
html.light .game-art{background:linear-gradient(115deg,#e7edf7,#fbf4df,#e2ecf7);border-color:#c9a15f;box-shadow:0 10px 25px rgba(44,63,94,.12)}
@media(max-width:540px){main{gap:11px;padding:12px}.game-art{height:120px;border-radius:12px}.launcher{padding:23px 18px}}
</style>
</head>
<body>
<header>
<div class="brand"><img src="logo.svg" alt="مكتب الجزيرة"><div><h1>مكتب الجزيرة</h1><small>PS4 HOST · GOLDHEN</small></div></div>
<button id="themeSwitch" class="theme" type="button" onclick="toggleTheme()" aria-label="تبديل الوضع الليلي والنهاري">☀ النهاري</button>
</header>
<main>
<div class="game-art"><img src="img/gaming-hero.png" alt="تصميم ألعاب مكتب الجزيرة" loading="eager"></div>
<section class="launcher" aria-label="تشغيل الجلبريك">
<h2>PS4 JAILBREAK</h2>
<button id="launch" class="launch" type="button" onclick="launchJailbreak()">فتح الجلبريك</button>
<div id="spin" aria-hidden="true"></div>
<p id="status" role="status" aria-live="polite"></p>
<div id="wrap" hidden><div id="state"></div><pre id="out"></pre></div>
<div id="msg" hidden></div>
</section>
</main>
<footer>العراق - الموصل - دورة سيدتي الجميلة<br>+964 771 715 8661</footer>
<script>
function setTheme(mode){
 var light=mode==='light',root=document.documentElement,button=document.getElementById('themeSwitch');
 root.className=light?'light':'';
 if(button)button.textContent=light?'☾ الليلي':'☀ النهاري';
}
function toggleTheme(){
 var mode=document.documentElement.className==='light'?'dark':'light';
 setTheme(mode);
 try{localStorage.setItem('jazTheme',mode)}catch(e){}
}
(function(){var mode='dark';try{mode=localStorage.getItem('jazTheme')||'dark'}catch(e){}setTheme(mode)})();
function statusText(text){var el=document.getElementById('status');el.textContent=text;el.className='visible'}
var started=false,checkTimer=null;
function launchJailbreak(){
 if(started)return;
 if(!/PlayStation\s+4/i.test(navigator.userAgent||'')){statusText('افتح الموقع من متصفح PS4.');return}
 started=true;
 var button=document.getElementById('launch'),spinner=document.getElementById('spin');
 button.disabled=true;spinner.style.display='block';
 statusText('جار تشغيل الأداة...');
 var script=document.createElement('script');script.type='module';script.src='jb.js?v=10';
 script.onerror=function(){spinner.style.display='none';statusText('تعذّر تحميل ملف التشغيل.');button.disabled=false;started=false};
 document.body.appendChild(script);
 checkTimer=setInterval(function(){
   if(document.body.className==='done'){clearInterval(checkTimer);spinner.style.display='none';statusText('اكتمل التشغيل بحسب نتيجة الأداة.')}
   if(document.body.className==='fail'){clearInterval(checkTimer);spinner.style.display='none';statusText('تعذر التشغيل. تحقق من توافق إصدار PS4.')}
 },800);
}
</script>
</body>
</html>
