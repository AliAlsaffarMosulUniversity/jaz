<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07111e">
<meta name="description" content="مكتب الجزيرة لألعاب البلايستيشن والحاسبات - PS4 HOST">
<title>مكتب الجزيرة | PS4 HOST</title>
<style>
*{box-sizing:border-box}
html{background:#060e1b}
html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif}
body{min-height:100vh;position:relative;color:#fff0cc;background:#081528 url('img/gaming-hero.png') center center/cover fixed no-repeat}
body:before{content:"";position:fixed;left:0;right:0;top:0;bottom:0;z-index:0;background:linear-gradient(180deg,rgba(3,9,21,.78),rgba(6,17,34,.76) 43%,rgba(3,9,19,.94)),linear-gradient(100deg,rgba(2,12,24,.55),transparent 36%,rgba(2,12,24,.42));pointer-events:none}
body:after{content:"";position:fixed;left:9%;right:9%;top:10%;height:48%;background:radial-gradient(ellipse at center,rgba(208,147,43,.14),transparent 68%);pointer-events:none}
header,main,footer{position:relative;z-index:1}
header{max-width:1280px;margin:10px auto 0;padding:9px 17px;background:rgba(3,12,25,.79);border:1px solid rgba(244,204,126,.39);border-radius:18px;display:flex;justify-content:space-between;align-items:center;gap:16px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:11px;color:#ffdc92;font-size:17px;font-weight:bold}
.brand img{width:46px;height:46px;object-fit:contain;border-radius:9px}
.brand small{display:block;font:10px Tahoma,Arial,sans-serif;letter-spacing:3px;color:#c2d2e0;margin-top:4px;direction:ltr;text-align:right}
button{font-family:Tahoma,Arial,sans-serif;cursor:pointer}
.theme{background:rgba(8,20,40,.88);border:1px solid rgba(225,180,91,.5);padding:10px 16px;border-radius:22px;color:#f8d489;font-size:14px;white-space:nowrap}
.theme:focus,.launch:focus,.diagnose:focus{outline:3px solid #fff2bb;outline-offset:3px}
main{max-width:1230px;margin:auto;padding:14px 18px 15px;text-align:center}
.identity{margin:0 auto 15px}
.crown{font-size:39px;line-height:1.05;color:#e8bc68;text-shadow:0 0 22px rgba(255,192,74,.6)}
h1{font-size:clamp(38px,5vw,68px);line-height:1.3;letter-spacing:1px;margin:0;color:#fce0a2;text-shadow:0 2px 1px #6a4317,0 5px 17px rgba(0,0,0,.9),0 0 28px rgba(253,172,45,.30)}
.tag{margin:1px 0 13px;font:16px/1.5 Tahoma,Arial,sans-serif;letter-spacing:6px;color:#f4db9f;direction:ltr}
.actions{max-width:530px;margin:0 auto}
.launch{width:100%;min-height:77px;border-radius:15px;border:2px solid #ffedb2;background:linear-gradient(170deg,#8b5719 0%,#dfac55 14%,#fff1b7 39%,#d49a36 65%,#a77320 100%);color:#2e1d06;font-size:clamp(23px,3vw,32px);font-weight:bold;text-shadow:0 1px rgba(255,255,255,.65);box-shadow:inset 0 3px 2px rgba(255,255,255,.8),inset 0 -3px 5px rgba(74,40,6,.35),0 0 0 3px rgba(204,151,43,.13),0 0 35px rgba(245,171,54,.40),0 8px 22px rgba(0,0,0,.4);transition:filter .2s,transform .2s}
.launch:hover{filter:brightness(1.1);transform:translateY(-2px)}
.launch[disabled]{opacity:.68;cursor:wait;transform:none}
.diagnose{margin-top:10px;padding:10px 28px;background:rgba(6,16,32,.78);border:1px solid #bc914e;border-radius:9px;color:#f5dba0;font-size:14px}
#status{display:none;margin:10px auto 0;max-width:580px;padding:9px 14px;border:1px solid rgba(233,182,88,.55);border-radius:9px;background:rgba(4,14,27,.92);color:#f7e0b2;font-size:14px;line-height:1.6}
#status.visible{display:block}
#spin{display:none;width:25px;height:25px;margin:10px auto 0;border:3px solid rgba(255,225,151,.23);border-top-color:#f5d38c;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gallery{display:flex;flex-wrap:nowrap;gap:13px;align-items:stretch;margin:24px 0 12px}
.game-frame{display:block;position:relative;flex:1 1 0;min-width:0;margin:0;border-radius:15px;overflow:hidden;border:2px solid #cda45c;background:#0a192d;box-shadow:inset 0 0 3px #ffebae,0 0 0 3px rgba(11,19,35,.65),0 3px 17px rgba(248,183,74,.25),0 10px 30px rgba(0,0,0,.40);height:190px}
.game-frame:after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;border:1px solid rgba(255,236,166,.62);border-radius:12px;pointer-events:none}
.game-frame img{display:block;width:100%;height:100%;object-fit:cover}
footer{max-width:830px;margin:0 auto 15px;padding:11px 22px;background:rgba(3,12,25,.82);border:1px solid rgba(227,178,89,.43);border-radius:15px;box-shadow:0 6px 25px rgba(0,0,0,.35);color:#e9d09c;text-align:center;font-size:14px;line-height:1.8}
.phone{direction:ltr;unicode-bidi:isolate;display:inline-block;white-space:nowrap;text-decoration:none;color:#ffe3a6;font-weight:bold}
.phone:hover{text-decoration:underline}
.sep{margin:0 16px;color:#bf9c5d}
#state,#out{display:none}
body.done #spin,body.fail #spin{display:none!important}
html.light{background:#e7ebf1}
html.light body{color:#303d52;background-color:#e4e8ef}
html.light body:before{background:linear-gradient(180deg,rgba(248,248,243,.86),rgba(242,246,251,.86) 48%,rgba(235,239,247,.94))}
html.light header,html.light footer{background:rgba(252,251,247,.9);color:#77521b;border-color:#c9a15a}
html.light .brand{color:#77501e}
html.light .brand small{color:#425874}
html.light .theme{background:#fff8e9;color:#684514}
html.light h1{color:#7a5119;text-shadow:0 1px #ffe9ae,0 4px 10px rgba(99,59,5,.15)}
html.light .crown{color:#986923}
html.light .tag{color:#71501e}
html.light .diagnose,html.light #status{color:#6c4a18;background:rgba(255,255,255,.89)}
html.light .phone{color:#6d4919}
@media(max-width:800px){header{margin:6px 9px 0}main{padding:14px 12px}.gallery{gap:10px}.game-frame{height:150px}h1{font-size:43px}}
@media(max-width:540px){header{padding:8px 10px}.brand{font-size:15px}.brand img{width:38px;height:38px}.brand small{font-size:9px;letter-spacing:1px}.theme{padding:8px 10px;font-size:12px}.crown{font-size:30px}h1{font-size:36px}.tag{font-size:12px;letter-spacing:3px}.launch{min-height:63px;font-size:23px}.gallery{flex-wrap:wrap;gap:8px;margin-top:15px}.game-frame{flex:1 1 45%;height:135px}.sep{display:none}footer{margin:0 8px 12px;font-size:12px}.phone{display:block}}
@media(prefers-reduced-motion:reduce){.launch{transition:none}#spin{animation:none}}
</style>
</head>
<body>
<header><div class="brand"><img src="logo.svg" alt="شعار مكتب الجزيرة"><div>مكتب الجزيرة<small>PS4 HOST | GOLDHEN</small></div></div><button id="themeSwitch" type="button" class="theme" onclick="toggleTheme()" aria-label="تبديل الوضع">☀ النهاري</button></header>
<main>
<div class="identity"><div class="crown" aria-hidden="true">♛</div><h1>مكتب الجزيرة</h1><p class="tag">PS4 HOST | GOLDHEN</p></div>
<div class="actions"><button id="launch" class="launch" type="button" onclick="launchJailbreak()">✦ فتح الجلبريك ✦</button><button class="diagnose" type="button" onclick="diagnose()">فحص المتصفح</button><div id="spin" aria-hidden="true"></div><p id="status" role="status" aria-live="polite"></p></div>
<section class="gallery" aria-label="صور الألعاب">
<figure class="game-frame"><img src="img/jaz-racing.svg" alt="ألعاب السباقات"></figure>
<figure class="game-frame"><img src="img/jaz-adventure.svg" alt="ألعاب المغامرات"></figure>
<figure class="game-frame"><img src="img/jaz-football.svg" alt="ألعاب كرة القدم"></figure>
<figure class="game-frame"><img src="img/jaz-fantasy.svg" alt="ألعاب الفانتازيا"></figure>
</section>
<div id="wrap" hidden><div id="state"></div><pre id="out"></pre></div><div id="msg" hidden></div>
</main>
<footer><span>📍 العراق - الموصل - دورة سيدتي الجميلة</span><span class="sep">|</span><a class="phone" dir="ltr" href="tel:+9647717158661"><bdi dir="ltr">+964 771 715 8661</bdi></a></footer>
<script>
function setTheme(mode){var light=mode==='light';document.documentElement.className=light?'light':'';var b=document.getElementById('themeSwitch');if(b)b.textContent=light?'☾ الليلي':'☀ النهاري'}
function toggleTheme(){var mode=document.documentElement.className==='light'?'dark':'light';setTheme(mode);try{localStorage.setItem('jazTheme',mode)}catch(e){}}
(function(){var mode='dark';try{mode=localStorage.getItem('jazTheme')||'dark'}catch(e){}setTheme(mode)})();
function showStatus(t){var el=document.getElementById('status');el.textContent=t;el.className='visible'}
function diagnose(){var m=/PlayStation\s+4[\/ ]([^;]+)/i.exec(navigator.userAgent||'');showStatus((m?'PS4 '+m[1]:'المتصفح: '+navigator.userAgent)+' | JavaScript: يعمل | '+(navigator.onLine?'متصل':'غير متصل'))}
var started=false,checkTimer=null;
function launchJailbreak(){
 if(started)return;
 if(!/PlayStation\s+4/i.test(navigator.userAgent||'')){showStatus('افتح الموقع من متصفح PS4.');return}
 started=true;
 var b=document.getElementById('launch'),sp=document.getElementById('spin');
 b.disabled=true;sp.style.display='block';showStatus('جار تشغيل الأداة...');
 var script=document.createElement('script');script.type='module';script.src='jb.js?v=10';
 script.onerror=function(){sp.style.display='none';showStatus('تعذّر تحميل ملف التشغيل.');b.disabled=false;started=false};
 document.body.appendChild(script);
 checkTimer=setInterval(function(){
   if(document.body.className==='done'){clearInterval(checkTimer);sp.style.display='none';showStatus('اكتمل التشغيل بحسب نتيجة الأداة.')}
   if(document.body.className==='fail'){clearInterval(checkTimer);sp.style.display='none';showStatus('تعذر التشغيل. تحقق من توافق إصدار PS4.')}
 },800)
}
</script>
</body></html>
